              - generic [ref=f3e429]:
                - paragraph [ref=f3e430]: 前阵子撬了一款圣茶来喝,头一泡印象一般,觉得价质不太符,心里有点不服气,正好朋友圈又在卖,就又入了一份试试。 这次学聪明了点,沿着上次撬茶的位置往薄处走,撬散一点,方便醒茶。第一水下去就有惊喜——闻香带着 烟香和蜜香 ,茶汤甜里带烟香,几无苦涩,这个跟上次的果香毫香完全不是一个路子。难怪这一批比601批次贵,我那会儿喝的时候还没烟香呢。 但跟昨晚刚喝的 801高山韵象 摆一块比,差距就出来了:801香气更纯净高雅,这个圣茶水路粗了不少,茶气冲击力偏弱,入口没有打头的感觉,挺平缓的。在大益烟香茶里我觉得只能排 第三梯队以后 了,甚至带一点点火气。 到了第三、四水倒是稳住了,茶汤开始有力度,身体明显有热感。投茶量小所以出汤稍慢,这点要注意。整体来说,涩感从头到尾都有点留存,喉感好,回甘生津是差那么一口气,不过这个价位也算及格偏上吧。 网上茶油说"蜜甜韵、苦不明显、协调性好、微涩有茶韵",跟我自己喝的差不多,只是烟香这个变量,得看批次碰运气。你们觉得,大益烟香茶里 圣茶、801高山韵象、那几个经典款 ,按水路、香气、茶气综合排,谁才是第一梯队?

                - paragraph [ref=f3e722]: 最近泡了泡 7262 ,顺手把它的来龙去脉捋了一遍,挺有意思,跟大家唠唠。 7262是70年代研制出来的配方,唛号里的"2"和"6"分别代表饼面茶和底茶用的原料等级。至于这个唛号啥时候正式"出生",说法是1996年,但市面上能找到的最早定型产品,基本是97、98年的试验品,量极少。我问过几个老茶商,他们的共识是:2000年以前基本是试制阶段,没批量生产,配方饼型都没定型,包装也不统一,甚至用过80年代的包纸。所以现在能见到的最早几个版面,就是 中茶绿印、无R红大益、中茶黄印 (黄印可能是定制款)这些。仓储方面,中茶绿印港仓版相对多见。2001到2014年,7262基本是常规产品年年出,2015年后减少,最近一次出品是2018年。 聊完7262,顺带说说 7572 。生茶大家都建议从7542入门,但熟茶这块我个人真不推荐7572当入门——别看它俩在生熟茶里地位差不多,7572真不太好一下喝明白。它的好处在 汤感和层次感 ,但这俩点你不对比着喝,光闷头喝7572,很难get到。 相比之下,7262的特点就特别容易抓:香气很显,早期的 糖香、枣香 ,中期的 熟米香、木质香、参香 ,一入

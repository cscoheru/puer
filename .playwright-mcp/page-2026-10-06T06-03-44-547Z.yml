              - paragraph [ref=f3e276]: 这个茶真的是经典，放在03年的勐海茶厂毫不逊色，其松烟香的地道和汤水融合度来说无出其右，有人会说水路厚薄的不足，我认为是鸡蛋里挑骨头：盲喝我是喝不出来的。今天秋高气爽湿度温度刚好，没有一点涩感，到了非常好的品饮时期了，可惜也没多少，一年喝上两泡还能喝四五年哈哈哈😂

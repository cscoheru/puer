              - generic [ref=f3e585]:
                - paragraph [ref=f3e586]: 茶样，32克1200，克价40块了，其实很不便宜，如果按照10克一泡，一泡就要400块，足够请人吃一顿饭了。润茶水烟香水甜无苦涩。 第一水，入口苦涩酸酽，那种酸中带苦的味道，仓没有问题。苦涩酸都能很快退去，微微的生津回甘，都不算强，茶气还没有感觉。 第二水，公道杯烟香樟香，苦涩更强，酸感弱了很多，这一泡应该是302-7222本真的滋味了，没什么杂味，茶汤的厚度不算厚，就是弄强度烟香沉水，开始打嗝。确实论苦涩浓强，03年还没有找到第二个。 第三水，此茶苦涩浓后的返甜以及生津回甘的力度还是不够，收敛感很强，口腔有较强的刺激性，但缺少苦尽甘来的感受，整体不够丰富。 第四水，这一泡更纯粹的苦感，酸感几乎没有了，两颊涩感生津感强，确实，论苦涩度，302还没有找到敌手。茶汤稍凉后那种苦涩更强，化得也快，两颊非常强的收敛感，稍微停一会再喝第五水。 第五水，如此苦涩的茶现在喝掉真是太可惜了，要登上十年再喝，如果这个茶的苦涩退掉大半，茶汤将是怎么样的？开始有点掉了。这茶让我香气那天在涛哥那里喝的断南，也是足够的强度，但似乎断南更加均衡，7222更苦涩，但甜度不如断南，郑旭说断南没有骨架感比较

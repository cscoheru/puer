                - link "2002-海湾7548（品名很山寨）" [ref=f3e194] [cursor=pointer]:
                  - /url: /forum/thread/tasting-draft_32de1abc-f522-489c-8821-ab918660ccca
              - generic [ref=f3e196]:
                - paragraph [ref=f3e197]: 今天开了一款2002年海湾茶厂的7548,用的盖碗冲泡,润茶水清甜无苦涩。下面简单记一下品饮感受。茶汤香气偏幽,带点果蜜香,也有轻微的梅子香,但整体不算很足。 第一水入口甜,生津带甜,几乎无苦涩。第二水苦涩上来,滋味变浓郁,果蜜香显,苦涩很快退去,带轻微梅子香,生津甜。第三水滋味比上一水淡一些,苦涩显但化得快,生津快,梅子香稍欠沉稳。第四水比较喜欢,饱满有力,茶汤活性强、有刺激感,苦涩甜协调,微微苦涩下两颊收敛性好,和203-7542的汤感滋味香气都有相似之处。第五水继续维持,汤感更圆润,略有涩感。第六水涩感变强,这类茶尾水涩感确实难控。第七水进入尾水,还能喝,苦涩几乎没了。 总体判断 7542该有的特点都在,显梅子韵,汤感粘稠,活性较好,前几水能喝出点八八青年轻时的味道。缺点就是香气不够足,尾水涩感偏强。整体看比同年的7542品质要高一些,价格估计只有三分之一,性价比还是不错的。
                - button "展开全文 ▼" [ref=f3e198]

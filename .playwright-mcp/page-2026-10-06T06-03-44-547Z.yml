              - paragraph [ref=f3e678]: 夜茶🍵：『五十年代·干仓无纸红印』[爱心][爱心][爱心] 有梅子韵、烟韵，还带着粉粉的花香， 干仓确实与众不同：口感活泼，带细微收敛感，回味细腻持久，喉底还留着原始原料的山野之气。这种体验，我也是喝到了才懂。 今日饮法：7.7g，130ml朱泥壶。 已喝到第十一泡，表现竟比平常投茶10g+还好。最近越发觉得：最佳投茶比，并不是越多越耐泡，很多时候反而适得其反……🤔[胜利][胜利][胜利]

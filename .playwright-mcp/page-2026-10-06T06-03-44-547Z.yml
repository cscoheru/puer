                - paragraph [ref=f3e320]: 最近翻出一泡2012年的 大益601岩韵 ,正好手边也有宝和祥13年的岩韵,就摆在一起对喝。这名字起得真容易让人误会——"岩骨花香"四个字一出来,很多人就拿来跟武夷岩茶对标,其实它就是一款打着"岩韵"概念的生普,路子还是生普的路子。 开汤润茶,公道杯蜜香里带着青味和一丝烟香,入口清甜,青味明显。第一水下去酽感就出来了,那种"岩味"挺有辨识度,推测是氨基酸和矿物质含量偏高。和06年同期的茶比,这款转化明显慢半拍,酸底重,涩感化开稍迟,生津回甘都慢半拍,典型的还年轻。 第二水开始有点意思了,公道杯里浮出轻樟香,退得倒快。茶汤咽下去回味一上来,就是岩石感带甘甜,水相对粗一些,两颊生津不错,花果香隐隐约约,韵感还没立起来。整体还是偏青涩,远没到最佳品饮期。 第三水开始有点像样了,涩感跟香气揉在一起,可以叫"岩韵涩"——不是那种讨人厌的死涩,是带着骨架的涩。第四水居然开始打嗝,香气变得直接,花香蜜香裹着岩味往上顶,这一水真的有几分岩茶的意思了,跟大红袍摆一块儿盲品还真不一定输阵。 可惜第五水就开始塌,甜度一掉,其他滋味跟着泄,香气也衰减,茶汤一下子软下来没骨架了,没耐心继续泡。 整体看

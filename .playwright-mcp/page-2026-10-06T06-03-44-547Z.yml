              - generic [ref=f3e779]:
                - paragraph [ref=f3e780]: "拿 2015岁月知味易武古韵、2012陈升号古韵圆茶、2008观自在凌波青带 三款做横评,主聊 蜜韵 的差别 先说结论:三款都出蜜韵,但 15古韵韵浅而短 ,12古韵和08青带基本打平,综合表现明显盖过15古韵。投茶等级作者尽量统一到大树料,前两款广东仓,08青带早年在昆明存(昆明干,转化大致追平广仓2010年前后),仓储这变量也算卡住了。 逐款记一下口感,方便我自己翻: · 15易武古韵 :这批稍微受潮,汤香不显,苦涩偏重,甜度一般。汤色清亮通透,生津回甘还行,咽下去喉底能返一点蜜香,茶味在口腔留存也算久——但作者原话是 \"口中有茶缺韵\" ,蜜韵挂不住,我理解就是有香有味但撑不起骨架,体感也不清晰。 · 12古韵圆茶 :入口微苦涩带点果酸,甜来得早,所以蜜韵跟着就 显现得清晰厚实 ,满口是茶。这条我划重点——甜度出现的时机直接决定蜜韵能不能立住。 · 08凌波青带 :作者没贴全口感,但蜜韵显现比12古韵还要 更清晰 ,香气往下沉,转化得更圆润。考虑到这料子早年昆明仓放了好几年,没受潮是关键。 我自己延伸一下,蜜韵这东西说玄也玄,落到杯子里其实就是三件事: 甜度出现的早晚"

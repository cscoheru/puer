                - link "03黄大益开汤:高烟香那版真有点东西,说说第三泡那个\"断片\"感" [ref=f3e527] [cursor=pointer]:
                  - /url: /forum/thread/839a2a74-cafa-49ed-853b-81a45b9321ca
              - generic [ref=f3e529]:
                - paragraph [ref=f3e530]: 最近喝了朋友那泡03黄大益,存世量少加上仓储折腾,现在能碰到明显烟香的其实不多了。我喝到的这泡属于 高烟香版本 ,一入口就是那种很典型的浓郁柴火烟,跟03年很多茶的路子一致,不算特别。 但这茶真正让我上头的是水路和中后段。前段穿透力很强,带着活泼的果酸,连我这种老烟枪都觉得有点冲——烟香里裹着爽朗的果酸,不是那种仓存过干出来的寡酸,这点区别挺明显的。心里还嘀咕,再放几年烟味褪下去,会不会走96玫瑰大益那种路子? 最妙的是 第三泡突然"衰减"了一下 ,我当时还以为这茶就这么结束了。结果第四泡甜度直接拉起来,中后段一路越来越甜,把前面堆起来的涩感全平衡掉了,嘴里全是甘甜和润感,烟香果香反倒退到背景里去了。我自己泡茶的感觉就像老相机拧变焦环—— 前景的苦涩被推远,藏在底下的甜度反而成了主角 ;再往后就像长焦镜头把景色整体拉远,香气滋味都渐渐模糊,但嘴里一直留着淡淡烟香的甜,直到喝不动都还有余韵。 黄大益背景资料一直不多,只知道是定制茶、产量小,经过20年消耗+仓储损耗,现在带明显烟香的存量真不算多,遇到且喝且珍惜吧。
